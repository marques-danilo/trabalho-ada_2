name: flash-sale

services:

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flash-sale-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12

  checkout-service:
    build:
      # Contexto na raiz: o modulo precisa do pom pai para compilar.
      context: .
      dockerfile: checkout-service/Dockerfile
    container_name: flash-sale-checkout
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - checkout-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  order-processor-service:
    build:
      context: .
      dockerfile: order-processor-service/Dockerfile
    container_name: flash-sale-order-processor
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - processor-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  redis-data:
  rabbitmq-data:
  checkout-data:
  processor-data:
